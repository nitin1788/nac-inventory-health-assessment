services:
  - type: web
    name: nac-inventory-assessment-api
    runtime: node
    plan: starter
    region: singapore
    rootDir: backend
    # --include=dev is required here: NODE_ENV=production (below) is
    # visible to this build step too, and plain `npm install` skips
    # devDependencies whenever NODE_ENV=production is set — which would
    # otherwise drop typescript, @types/node, and @types/express before
    # `npm run build` (tsc) ever runs.
    buildCommand: npm install --include=dev && npm run build
    startCommand: npm start
    healthCheckPath: /api/v1/health
    autoDeployTrigger: commit
    envVars:
      - key: NODE_ENV
        value: production
      # Pins the runtime to Node 20 LTS (highest-precedence method Render
      # supports — takes priority over .node-version and package.json's
      # engines field, both also set to 20 as fallbacks). Render otherwise
      # defaults to its newest available runtime.
      - key: NODE_VERSION
        value: "20"
      # All values below are secrets or environment-specific and must be
      # set manually in the Render dashboard — never committed to the repo.
      - key: SUPABASE_URL
        sync: false
      - key: SUPABASE_SERVICE_ROLE_KEY
        sync: false
      - key: RESEND_API_KEY
        sync: false
      - key: RESEND_FROM_EMAIL
        sync: false
      - key: NAC_LEAD_ALERT_EMAIL
        sync: false
      # The deployed frontend origin(s), comma-separated if more than
      # one (e.g. custom domain + Vercel project URL). See
      # backend/src/config/cors.ts.
      - key: CORS_ORIGIN
        sync: false
      - key: TURNSTILE_SECRET_KEY
        sync: false
      # PayU (see backend/src/modules/payment/payment.provider.payu.ts).
      # PAYU_ENV defaults to 'test' if left unset — it must be set to
      # exactly 'production' here for LIVE checkout to ever be used;
      # otherwise a LIVE key/salt would silently be sent to PayU's TEST
      # endpoint instead of secure.payu.in.
      - key: PAYU_KEY
        sync: false
      - key: PAYU_SALT
        sync: false
      - key: PAYU_ENV
        value: production
      # This service's own public HTTPS URL — used to build PayU's
      # surl/furl callback URLs. Must not be localhost in production.
      - key: BACKEND_BASE_URL
        sync: false
      # The deployed frontend's public HTTPS URL — used for
      # payment-retry/thank-you redirects. Must not be localhost in production.
      - key: FRONTEND_BASE_URL
        sync: false
