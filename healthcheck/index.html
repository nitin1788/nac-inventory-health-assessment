<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Business Health Check — Nitin Anand Consulting</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@600;700;800&family=Inter:wght@400;500;600;700&family=IBM+Plex+Mono:wght@500;600&display=swap" rel="stylesheet">
<script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/html2canvas/1.4.1/html2canvas.min.js"></script>
<style>
  :root{
    --indigo:#0F2A52;
    --indigo-light:#1E4785;
    --teal:#0B6E4F;
    --amber:#E8A33D;
    --bg:#F4F6F8;
    --card:#FFFFFF;
    --text:#1A2333;
    --muted:#5B6472;
    --border:#E2E6EC;
    --danger:#C0392B;
  }
  *{box-sizing:border-box; margin:0; padding:0;}
  body{
    font-family:'Inter', sans-serif;
    background:var(--bg);
    color:var(--text);
    line-height:1.5;
  }
  .app{max-width:760px; margin:0 auto; padding:24px 20px 80px;}

  /* Header */
  .brand{display:flex; align-items:center; margin-bottom:8px; padding-bottom:14px; border-bottom:2px solid; border-image:linear-gradient(90deg, var(--indigo), var(--amber)) 1;}
  .brand-logo-img{height:52px; width:auto;}
  .brand-tagline{text-align:center; font-size:10.5px; color:var(--muted); letter-spacing:.03em; margin:0 0 20px; font-weight:600;}

  /* Promotional footer (thank-you screen) */
  .promo-footer{text-align:center; margin-top:22px;}
  .promo-footer img{height:40px; width:auto; margin-bottom:10px;}
  .promo-footer .pf-tag{font-size:11px; color:var(--indigo); font-weight:700; margin-bottom:4px;}
  .promo-footer .pf-contact{font-size:11px; color:var(--muted);}

  /* Progress */
  .progress-wrap{margin-bottom:32px;}
  .progress-track{height:6px; background:var(--border); border-radius:99px; overflow:hidden;}
  .progress-fill{height:100%; background:linear-gradient(90deg, var(--teal), var(--indigo)); border-radius:99px; transition:width .4s ease;}
  .progress-label{display:flex; justify-content:space-between; margin-top:8px; font-size:12px; color:var(--muted); font-family:'IBM Plex Mono';}

  /* Hero (step 0) */
  .hero h1{
    font-family:'Poppins'; font-weight:800; font-size:28px; color:var(--indigo);
    line-height:1.25; margin-bottom:12px;
  }
  .hero p{color:var(--muted); font-size:15px; margin-bottom:24px; max-width:56ch;}
  .hero-pillars{display:grid; grid-template-columns:1fr; gap:10px; margin-bottom:28px;}
  .pillar{
    display:flex; align-items:center; gap:12px;
    background:var(--card); border:1px solid var(--border); border-radius:12px; padding:14px 16px;
  }
  .pillar .dot{width:8px; height:8px; border-radius:50%; flex-shrink:0;}
  .pillar .dot.inv{background:var(--teal);}
  .pillar .dot.ops{background:var(--indigo);}
  .pillar .dot.dm{background:var(--amber);}
  .pillar div span{display:block;}
  .pillar .p-title{font-weight:600; font-size:14px;}
  .pillar .p-sub{font-size:12px; color:var(--muted);}

  /* Card / Step */
  .card{
    background:var(--card); border:1px solid var(--border); border-radius:16px;
    padding:24px; margin-bottom:16px;
  }
  .step-eyebrow{
    font-family:'IBM Plex Mono'; font-size:11px; letter-spacing:.06em; text-transform:uppercase;
    color:var(--muted); margin-bottom:6px;
  }
  .step-title{font-family:'Poppins'; font-weight:700; font-size:19px; margin-bottom:18px; color:var(--text);}

  .field{margin-bottom:18px;}
  .field label{display:block; font-size:13px; font-weight:600; margin-bottom:6px; color:var(--text);}
  .field .hint{font-size:12px; color:var(--muted); margin-bottom:8px;}
  input[type=text], input[type=tel], input[type=email], input[type=number], select{
    width:100%; padding:11px 12px; border:1.5px solid var(--border); border-radius:9px;
    font-family:'Inter'; font-size:14px; background:#fff; color:var(--text);
  }
  input:focus, select:focus{outline:none; border-color:var(--indigo-light);}

  .choice-grid{display:grid; gap:8px;}
  .choice{
    border:1.5px solid var(--border); border-radius:10px; padding:12px 14px;
    cursor:pointer; font-size:14px; display:flex; align-items:center; gap:10px;
    transition:.15s;
  }
  .choice:hover{border-color:var(--indigo-light);}
  .choice.selected{border-color:var(--indigo); background:#EEF2FA; font-weight:600;}
  .choice .radio{
    width:16px; height:16px; border-radius:50%; border:2px solid var(--border); flex-shrink:0;
    position:relative;
  }
  .choice.selected .radio{border-color:var(--indigo);}
  .choice.selected .radio::after{
    content:''; position:absolute; inset:2px; border-radius:50%; background:var(--indigo);
  }

  .nav-row{display:flex; gap:10px; justify-content:space-between; margin-top:8px;}
  button{font-family:'Inter'; font-weight:600; font-size:14px; border:none; border-radius:9px; padding:13px 22px; cursor:pointer;}
  .btn-primary{background:var(--indigo); color:#fff; flex:1;}
  .btn-primary:hover{background:var(--indigo-light);}
  .btn-primary:disabled{background:#B9C2D0; cursor:not-allowed;}
  .btn-ghost{background:transparent; color:var(--muted); border:1.5px solid var(--border);}
  .btn-ghost:hover{border-color:var(--muted); color:var(--text);}

  /* Results */
  .results-head{text-align:center; margin-bottom:24px;}
  .score-ring-wrap{position:relative; width:180px; height:180px; margin:0 auto 16px;}
  .score-ring-wrap svg{transform:rotate(-90deg);}
  .score-center{
    position:absolute; inset:0; display:flex; flex-direction:column; align-items:center; justify-content:center;
  }
  .score-center .num{font-family:'Poppins'; font-weight:800; font-size:40px; color:var(--indigo);}
  .score-center .lbl{font-size:11px; color:var(--muted); text-transform:uppercase; letter-spacing:.05em;}
  .results-head h2{font-family:'Poppins'; font-weight:700; font-size:20px; margin-bottom:6px;}
  .results-head p{color:var(--muted); font-size:14px;}

  .cat-card{
    background:var(--card); border:1px solid var(--border); border-radius:14px; padding:18px; margin-bottom:12px;
  }
  .cat-head{display:flex; justify-content:space-between; align-items:center; margin-bottom:10px;}
  .cat-head .cname{font-weight:700; font-size:14px; display:flex; align-items:center; gap:8px;}
  .cat-head .cscore{font-family:'IBM Plex Mono'; font-weight:600; font-size:15px;}
  .bar-track{height:8px; background:var(--border); border-radius:99px; overflow:hidden; margin-bottom:10px;}
  .bar-fill{height:100%; border-radius:99px;}
  .cat-note{font-size:13px; color:var(--muted);}
  .cat-note b{color:var(--text);}

  .cta-card{
    background:linear-gradient(135deg, var(--indigo), var(--indigo-light));
    border-radius:16px; padding:22px; color:#fff; text-align:center; margin-top:20px;
  }
  .cta-card h3{font-family:'Poppins'; font-size:17px; margin-bottom:8px;}
  .cta-card p{font-size:13px; opacity:.9; margin-bottom:16px;}
  .cta-card button{background:var(--amber); color:var(--indigo); width:100%; margin-bottom:8px; font-weight:700;}
  .cta-card .sub-btn{background:rgba(255,255,255,.15); color:#fff; width:100%;}

  .footer-note{text-align:center; font-size:11px; color:var(--muted); margin-top:20px;}

  @media (min-width:600px){
    .hero-pillars{grid-template-columns:1fr 1fr 1fr;}
  }

  /* ================= BRANDED REPORT (rpt-) ================= */
  .rpt-page{
    width:794px; height:1123px; background:#fff; position:relative;
    overflow:hidden; display:flex; flex-direction:column;
    font-family:'Inter',sans-serif; color:#1A2333;
  }
  .rpt-footer{
    background:linear-gradient(90deg, #0F2A52, #1E4785); color:#fff;
    padding:20px 40px; display:flex; align-items:center; justify-content:space-between;
    margin-top:auto;
  }
  .rpt-footer .msg{font-family:'Poppins'; font-weight:700; font-size:13px; line-height:1.4;}
  .rpt-footer .msg span{display:block; font-family:'Inter'; font-weight:400; font-size:11px; opacity:.85; margin-top:3px;}
  .rpt-footer .contact{text-align:right; font-size:11px; line-height:1.7;}
  .rpt-footer .contact b{font-family:'IBM Plex Mono'; font-weight:600;}
  .rpt-pagenum{position:absolute; bottom:8px; right:16px; font-size:9px; color:#5B6472; font-family:'IBM Plex Mono';}

  .rpt-strip{display:flex; align-items:center; justify-content:space-between; padding:18px 40px 14px; border-bottom:2px solid #E2E6EC;}
  .rpt-strip .rs-left{display:flex; align-items:center; gap:10px;}
  .rpt-strip img.rs-icon{height:26px; width:auto;}
  .rpt-strip .rs-name{font-family:'Poppins'; font-weight:700; font-size:13px; color:#0F2A52;}
  .rpt-strip .rs-right{font-size:10.5px; color:#5B6472; font-family:'IBM Plex Mono'; text-align:right;}

  .rpt-content{padding:24px 40px; flex:1;}

  .rpt-letterhead{background:#fff; padding:28px 44px 22px; display:flex; justify-content:space-between; align-items:center; border-bottom:3px solid; border-image:linear-gradient(90deg,#0F2A52,#E8A33D) 1;}
  .rpt-cover-logo{height:74px; width:auto;}
  .rpt-cover-meta{text-align:right; font-size:11px; color:#5B6472; font-family:'IBM Plex Mono'; line-height:1.8;}
  .rpt-cover-meta .conf{background:#0F2A52; color:#fff; border-radius:4px; padding:4px 10px; display:inline-block; margin-bottom:6px; letter-spacing:.05em;}

  .rpt-cover-body{flex:1; display:flex; flex-direction:column; align-items:center; justify-content:center; padding:26px 44px; text-align:center;}
  .rpt-cover-body .eyebrow{font-family:'IBM Plex Mono'; font-size:12px; letter-spacing:.1em; color:#5B6472; text-transform:uppercase; margin-bottom:10px;}
  .rpt-cover-body h1{font-family:'Poppins'; font-weight:800; font-size:36px; color:#0F2A52; line-height:1.22; margin-bottom:12px;}
  .rpt-cover-body .prepared{font-size:14px; color:#5B6472; margin-bottom:38px;}
  .rpt-cover-body .prepared b{color:#1A2333;}

  .rpt-ring-wrap{position:relative; width:230px; height:230px; margin-bottom:16px;}
  .rpt-ring-wrap svg{transform:rotate(-90deg);}
  .rpt-ring-center{position:absolute; inset:0; display:flex; flex-direction:column; align-items:center; justify-content:center;}
  .rpt-ring-center .num{font-family:'Poppins'; font-weight:800; font-size:54px; color:#0F2A52;}
  .rpt-ring-center .lbl{font-size:12px; color:#5B6472; text-transform:uppercase; letter-spacing:.05em; margin-top:2px;}
  .rpt-ring-status{font-family:'Poppins'; font-weight:700; font-size:16px; margin-bottom:34px;}

  .rpt-pillars{display:flex; gap:16px; width:100%; max-width:560px;}
  .rpt-pillar{flex:1; border:1.5px solid #E2E6EC; border-radius:12px; padding:16px 12px; text-align:center;}
  .rpt-pillar .cp-score{font-family:'Poppins'; font-weight:800; font-size:26px;}
  .rpt-pillar .cp-label{font-size:11px; color:#5B6472; margin-top:5px; font-weight:600;}
  .rpt-pillar .cp-bar-track{height:5px; background:#E2E6EC; border-radius:99px; margin-top:9px; overflow:hidden;}
  .rpt-pillar .cp-bar-fill{height:100%; border-radius:99px;}

  .rpt-section-title{font-family:'Poppins'; font-weight:800; font-size:21px; color:#0F2A52; margin-bottom:5px;}
  .rpt-section-sub{font-size:12.5px; color:#5B6472; margin-bottom:16px;}

  .rpt-bigbar-row{display:flex; align-items:center; gap:12px; margin-bottom:11px;}
  .rpt-bigbar-label{width:150px; font-size:12px; font-weight:600; flex-shrink:0;}
  .rpt-bigbar-track{flex:1; height:17px; background:#E2E6EC; border-radius:99px; overflow:hidden; position:relative;}
  .rpt-bigbar-fill{height:100%; border-radius:99px;}
  .rpt-bigbar-val{width:40px; text-align:right; font-family:'IBM Plex Mono'; font-weight:600; font-size:12px; flex-shrink:0;}

  table.rpt-summary{width:100%; border-collapse:collapse; margin-top:18px; font-size:11.5px;}
  table.rpt-summary th{background:#0F2A52; color:#fff; text-align:left; padding:8px 11px; font-family:'Poppins'; font-weight:600; font-size:11px;}
  table.rpt-summary td{padding:8px 11px; border-bottom:1px solid #E2E6EC;}
  table.rpt-summary tr:nth-child(even) td{background:#FAFBFC;}
  .rpt-pill{display:inline-block; padding:3px 10px; border-radius:99px; font-size:10.5px; font-weight:700; color:#fff;}

  .rpt-priority-box{border:1.5px solid #C0392B; background:#FDF2F1; border-radius:12px; padding:16px 18px; margin-top:20px;}
  .rpt-priority-box .pb-title{font-family:'Poppins'; font-weight:700; font-size:13.5px; color:#C0392B; margin-bottom:9px;}
  .rpt-priority-box ul{margin:0; padding-left:20px; font-size:12px; line-height:1.95;}

  .rpt-cat-header{display:flex; align-items:center; justify-content:space-between; margin-bottom:16px;}
  .rpt-cat-header .cat-title{font-family:'Poppins'; font-weight:800; font-size:22px;}
  .rpt-cat-header .cat-score{font-family:'Poppins'; font-weight:800; font-size:32px;}
  .rpt-cat-header .cat-score .of100{font-size:14px; font-weight:600; color:#5B6472;}

  .rpt-chart-box{border:1px solid #E2E6EC; border-radius:12px; padding:14px 16px; margin-bottom:18px;}
  .rpt-chart-box .cb-title{font-family:'Poppins'; font-weight:700; font-size:11.5px; color:#5B6472; margin-bottom:11px; text-transform:uppercase; letter-spacing:.04em;}
  .rpt-hbar-row{display:flex; align-items:center; gap:9px; margin-bottom:9px;}
  .rpt-hbar-label{width:165px; font-size:11px; font-weight:600;}
  .rpt-hbar-track{flex:1; height:11px; background:#E2E6EC; border-radius:99px; overflow:hidden;}
  .rpt-hbar-fill{height:100%; border-radius:99px;}
  .rpt-hbar-val{width:30px; text-align:right; font-family:'IBM Plex Mono'; font-size:10.5px; font-weight:600;}

  table.rpt-findings{width:100%; border-collapse:collapse; font-size:10.8px;}
  table.rpt-findings th{text-align:left; padding:8px 9px; font-family:'Poppins'; font-weight:600; font-size:10px; color:#fff;}
  table.rpt-findings td{padding:8px 9px; border-bottom:1px solid #E2E6EC; vertical-align:top; line-height:1.5;}
  table.rpt-findings td.dim{font-weight:700; width:17%;}
  table.rpt-findings td.rec{background:#F4F8F5;}
  table.rpt-findings tr:nth-child(even) td{background:#FAFBFC;}
  table.rpt-findings tr:nth-child(even) td.rec{background:#EFF6F0;}

  .rpt-closing{background:linear-gradient(135deg,#0F2A52,#1E4785); color:#fff; border-radius:14px; padding:20px 22px; margin-top:18px; text-align:center;}
  .rpt-closing h3{font-family:'Poppins'; font-weight:700; font-size:15px; margin-bottom:7px;}
  .rpt-closing p{font-size:11.5px; opacity:.9;}

  /* Rupee estimate box */
  .rpt-estimate-box{background:linear-gradient(135deg,#FDF2F1,#FFF8F0); border:1.5px solid #C0392B; border-radius:12px; padding:15px 19px; margin-bottom:17px; display:flex; align-items:center; gap:17px;}
  .rpt-estimate-box .e-icon{font-size:28px;}
  .rpt-estimate-box .e-label{font-family:'Poppins'; font-weight:600; font-size:11px; color:#5B6472; text-transform:uppercase; letter-spacing:.03em;}
  .rpt-estimate-box .e-value{font-family:'Poppins'; font-weight:800; font-size:23px; color:#C0392B;}
  .rpt-estimate-box .e-note{font-size:9.5px; color:#5B6472; margin-top:2px;}

  /* Quick win badge */
  .rpt-qw-badge{display:inline-block; font-size:8.5px; font-weight:700; padding:2px 7px; border-radius:99px; margin-top:3px;}
  .rpt-qw-fast{background:#E8F5EC; color:#0B6E4F;}
  .rpt-qw-structural{background:#FDF1E8; color:#B8791F;}

  /* Why NAC comparison */
  .rpt-whynac{margin-top:17px;}
  .rpt-whynac-title{font-family:'Poppins'; font-weight:700; font-size:13px; color:#0F2A52; margin-bottom:9px;}
  table.rpt-whynac-table{width:100%; border-collapse:collapse; font-size:10.3px;}
  table.rpt-whynac-table th{padding:7px 10px; font-family:'Poppins'; font-weight:600; font-size:10px; color:#fff; text-align:left;}
  table.rpt-whynac-table th.diy{background:#8B94A3;}
  table.rpt-whynac-table th.nac{background:#0F2A52;}
  table.rpt-whynac-table td{padding:7px 10px; border-bottom:1px solid #E2E6EC;}
  table.rpt-whynac-table td.label{font-weight:600; width:26%;}

  /* QR + signature footer block */
  .rpt-close-bottom{display:flex; align-items:center; justify-content:space-between; margin-top:17px; padding-top:13px; border-top:1px solid #E2E6EC;}
  .rpt-close-bottom .sig{font-size:10.5px; color:#5B6472;}
  .rpt-close-bottom .sig b{display:block; font-family:'Poppins'; font-size:13px; color:#1A2333;}
  .rpt-close-bottom .qr-block{text-align:center;}
  .rpt-close-bottom .qr-block img{width:60px; height:60px;}
  .rpt-close-bottom .qr-block div{font-size:8.5px; color:#5B6472; margin-top:2px;}
  .rpt-validity-note{font-size:9px; color:#5B6472; text-align:center; margin-top:9px; font-style:italic;}
  .rpt-reassess-note{background:#EEF2FA; border-radius:10px; padding:11px 15px; margin-top:13px; font-size:10.5px; color:#0F2A52; text-align:center; font-weight:600;}

  /* Potential score projection */
  .rpt-potential-box{display:flex; align-items:center; justify-content:center; gap:20px; background:#F4F8F5; border:1.5px solid #0B6E4F; border-radius:12px; padding:15px 20px; margin:15px 0;}
  .rpt-potential-box .p-num{font-family:'Poppins'; font-weight:800; font-size:28px;}
  .rpt-potential-box .p-cur{color:#C0392B;}
  .rpt-potential-box .p-pot{color:#0B6E4F;}
  .rpt-potential-box .p-arrow{font-size:22px; color:#5B6472;}
  .rpt-potential-box .p-label{font-size:9px; color:#5B6472; text-transform:uppercase; text-align:center;}
  .rpt-potential-note{font-size:9px; color:#5B6472; text-align:center; font-style:italic; margin-bottom:15px;}

  /* What's working well */
  .rpt-strengths-box{border:1.5px solid #0B6E4F; background:#F4F8F5; border-radius:12px; padding:15px 17px; margin-top:15px;}
  .rpt-strengths-box .sb-title{font-family:'Poppins'; font-weight:700; font-size:13.5px; color:#0B6E4F; margin-bottom:9px;}
  .rpt-strengths-box ul{margin:0; padding-left:19px; font-size:12px; line-height:1.9;}

  /* Cost of waiting */
  .rpt-cow-line{font-size:10.5px; color:#C0392B; font-weight:600; margin-top:7px;}

  /* Appendix page */
  .rpt-appendix-cols{column-count:2; column-gap:24px;}
  .rpt-appendix-item{break-inside:avoid; font-size:9.6px; padding:6px 0; border-bottom:1px solid #EEE; margin-bottom:2px;}
  .rpt-appendix-item b{display:block; font-size:9.6px; color:#1A2333; margin-bottom:1px;}
  .rpt-appendix-item span{color:#5B6472;}
  .rpt-appendix-cat-label{font-family:'Poppins'; font-weight:700; font-size:12px; margin:11px 0 7px; break-after:avoid;}

</style>
</head>
<body>
<div class="app" id="app"></div>

<script>
/* ---------------- CONFIG: Questions per service ---------------- */
const QUESTIONS = {
  lead: {
    title: "Let's start with your business",
    eyebrow: "Step 1 of 5",
    fields: [
      {id:"bizName", label:"Business ka Naam", type:"text", placeholder:"jaise Shree Ganesh Medical Store"},
      {id:"ownerName", label:"Owner / Contact Person ka Naam", type:"text", placeholder:"Aapka naam"},
      {id:"phone", label:"WhatsApp Number", type:"tel", placeholder:"98xxxxxxxx"},
      {id:"email", label:"Email (report ke liye)", type:"email", placeholder:"you@example.com"},
      {id:"area", label:"City / Area", type:"text", placeholder:"jaise Andheri West, Mumbai"},
    ]
  },
  inventory: {
    title: "Inventory Management",
    eyebrow: "Step 2 of 5 — Inventory",
    color: "teal",
    questions: [
      {id:"inv_deadstock", q:"Kitni baar aapko expired ya dead stock milta hai?", options:[
        {v:0,t:"Bahut baar — har mahine"},{v:1,t:"Kabhi kabhi — kuch mahino mein ek baar"},{v:2,t:"Kam hi — hum achhe se track karte hain"}]},
      {id:"inv_reorder", q:"Stock reorder karne ka decision kaise lete hain?", options:[
        {v:0,t:"Andaza laga ke / jab kam dikhta hai"},{v:1,t:"Manual tracking (register/Excel)"},{v:2,t:"Software se reorder alerts"}]},
      {id:"inv_audit", q:"Aapne last full stock audit kab kiya tha?", options:[
        {v:0,t:"Kabhi nahi / yaad nahi"},{v:1,t:"6-12 mahine pehle"},{v:2,t:"Pichhle 3 mahino mein"}]},
      {id:"inv_capital", q:"Kitna working capital slow-moving stock mein 'atka' hua feel hota hai?", options:[
        {v:0,t:"Bahut zyada — chinta hoti hai"},{v:1,t:"Thoda, manage ho jata hai"},{v:2,t:"Bahut kam"}]},
      {id:"inv_barcode", q:"Stock in-out ke liye barcode/scanning system use karte hain?", options:[
        {v:0,t:"Nahi, sab manual hai"},{v:1,t:"Kuch items ke liye"},{v:2,t:"Haan, fully scanned"}]},
      {id:"inv_expirytrack", q:"Stock ki expiry dates kaise track karte hain?", options:[

const PURCHASE_MIDPOINT = [50000, 300000, 750000, 1200000];      // per bracket index 0-3
const DEADSTOCK_PCT_MIDPOINT = [0.03, 0.10, 0.20, 0.30];         // per bracket index 0-3

function deadStockEstimate(){
  const pv = state.answers.inv_purchase_value;
  const dp = state.answers.inv_deadstock_pct;
  if(typeof pv !== "number" || typeof dp !== "number") return null;
  const point = PURCHASE_MIDPOINT[pv] * DEADSTOCK_PCT_MIDPOINT[dp];
  return [Math.round(point*0.7/1000)*1000, Math.round(point*1.3/1000)*1000];
}

function formatINR(n){
  n = Math.round(n);
  if(n >= 100000){
    let lakhs = (n/100000).toFixed(1).replace(/\.0$/,'');
    return `₹${lakhs}L`;
  }
  return `₹${n.toLocaleString('en-IN')}`;
}

function subthemeScore(qids){
  let total = 0;
  qids.forEach(q=>{ total += (state.answers[q] || 0); });
  return Math.round((total/(qids.length*2))*100);
}

function potentialCategoryScore(cat){
  const subs = SUBTHEMES[cat];
  let total = 0;
  subs.forEach(([name, qids])=>{
    const s = subthemeScore(qids);
    total += bandOf(s) === "strong" ? s : 85;
  });
  return Math.round(total/subs.length);
}

function topStrengths(allSub, n){
  return [...allSub].sort((a,b)=>b[2]-a[2]).slice(0,n||2);
}

function bandOf(score){ if(score>=75) return "strong"; if(score>=45) return "attention"; return "critical"; }
function bandLabel(score){ return {strong:"Strong", attention:"Needs Attention", critical:"Critical Gap"}[bandOf(score)]; }
function bandColor(score){ return {strong:"#0B6E4F", attention:"#E8A33D", critical:"#C0392B"}[bandOf(score)]; }

function donutSVG(pct, color, size=230, stroke=16){
  const r = (size/2)-stroke;
  const circ = 2*Math.PI*r;
  const offset = circ - (pct/100)*circ;
  return `<svg width="${size}" height="${size}">
    <circle cx="${size/2}" cy="${size/2}" r="${r}" stroke="#E2E6EC" stroke-width="${stroke}" fill="none"/>
    <circle cx="${size/2}" cy="${size/2}" r="${r}" stroke="${color}" stroke-width="${stroke}" fill="none"
      stroke-linecap="round" stroke-dasharray="${circ}" stroke-dashoffset="${offset}"/>
  </svg>`;
}

  const potOps = potentialCategoryScore("operations");

  const potentialOverall = Math.round((potInv+potOps+potDm)/3);
  const potentialHtml = `<div class="rpt-potential-box">
    <div><div class="p-num p-cur">${overall}</div><div class="p-label">Current Overall</div></div>
    <div class="p-arrow">&rarr;</div>
    <div><div class="p-num p-pot">${potentialOverall}</div><div class="p-label">Potential After Action</div></div>
  </div>
  <div class="rpt-potential-note">Illustrative projection if identified gaps are closed — actual results depend on execution, not a guarantee.</div>`;

  let allSub = [];
  ["inventory","operations","marketing"].forEach(cat=>{
    SUBTHEMES[cat].forEach(([name, qids])=>{
      allSub.push([CAT_META[cat].label, name, subthemeScore(qids)]);
    });
  });

  let rows = "";
  allSub.forEach(([catlabel,name,s])=>{
    const c = bandColor(s);
    rows += `<tr><td>${catlabel}</td><td>${name}</td>
      <td><span class="rpt-pill" style="background:${c}">${bandLabel(s)}</span></td>
      <td style="font-family:'IBM Plex Mono';font-weight:600;">${s}/100</td></tr>`;
  });

  const weakest = [...allSub].sort((a,b)=>a[2]-b[2]).slice(0,3);
  let priorityItems = "";
  weakest.forEach(([catlabel,name,s])=>{
    const qw = QUICK_WIN[name] !== false;
    const badge = qw ? '<span class="rpt-qw-badge rpt-qw-fast">QUICK WIN</span>' : '<span class="rpt-qw-badge rpt-qw-structural">STRUCTURAL FIX</span>';
    priorityItems += `<li><b>${name}</b> (${catlabel}) ${badge}<br>${REPORT_CONTENT[name].problem}</li>`;
  });

  // Top 2 strengths — always from the client's own data
  const strengths = topStrengths(allSub, 2);
  let strengthsItems = "";
  strengths.forEach(([catlabel,name,s])=>{
    const txt = bandOf(s) === "strong" ? REPORT_CONTENT[name].praise : "Your relatively strongest area right now — a foundation worth building on.";
    strengthsItems += `<li><b>${name}</b> (${catlabel}) — ${s}/100<br>${txt}</li>`;
  });
  const strengthsHtml = `<div class="rpt-strengths-box">
    <div class="sb-title">✓ Where You're Already Ahead</div>
    <ul>${strengthsItems}</ul>
  </div>`;

  return `<div class="rpt-page">
    ${rptStrip(reportDate)}
    <div class="rpt-content">
      <div class="rpt-section-title">Executive Summary</div>
      <div class="rpt-section-sub">Your overall standing across all three service areas, at a glance.</div>
      ${bigbars}
      ${potentialHtml}
      <table class="rpt-summary">
        <tr><th>Service Area</th><th>Sub-Dimension</th><th>Status</th><th>Score</th></tr>
        ${rows}
      </table>
      <div class="rpt-priority-box">
        <div class="pb-title">⚠ Top 3 Priority Areas</div>
        <ul>${priorityItems}</ul>
      </div>
      ${strengthsHtml}
    </div>
    ${rptFooter()}
    <div class="rpt-pagenum">Page 2 of 6</div>
  </div>`;
}

function nextBusinessDate(){
  const d = new Date();
  d.setDate(d.getDate() + 1);
  if(d.getDay() === 0){ d.setDate(d.getDate() + 1); } // skip Sunday -> Monday
  return d.toLocaleDateString('en-IN', {day:'numeric', month:'short', year:'numeric'});
}

function buildAppendixPage(reportDate){

function buildAllReportPages(invScore, opsScore, dmScore, overall){
  const reportDate = nextBusinessDate();
  return [
    buildCoverPage(invScore, opsScore, dmScore, overall, reportDate),
    buildSummaryPage(invScore, opsScore, dmScore, reportDate),
    buildCategoryPage("inventory", reportDate, 3, false),
    buildCategoryPage("operations", reportDate, 4, false),
    buildCategoryPage("marketing", reportDate, 5, true),
    buildAppendixPage(reportDate),
  ];
}

/* Renders each page off-screen, captures it, and assembles a multi-page PDF */
async function generateBrandedPDF(invScore, opsScore, dmScore, overall){
  const pages = buildAllReportPages(invScore, opsScore, dmScore, overall);
  const { jsPDF } = window.jspdf;
  const pdf = new jsPDF('p', 'pt', 'a4');
  const pdfW = pdf.internal.pageSize.getWidth();
  const pdfH = pdf.internal.pageSize.getHeight();

  const host = document.createElement('div');
  host.style.position = 'fixed';
  host.style.left = '-9999px';
  host.style.top = '0';
  document.body.appendChild(host);

  for(let i=0;i<pages.length;i++){
    host.innerHTML = pages[i];
    const pageEl = host.querySelector('.rpt-page');
    await new Promise(r=>setTimeout(r, 60)); // let images/layout settle
    const canvas = await html2canvas(pageEl, {scale:2, backgroundColor:'#ffffff', useCORS:true});
    const imgData = canvas.toDataURL('image/jpeg', 0.92);
    if(i>0) pdf.addPage();
    pdf.addImage(imgData, 'JPEG', 0, 0, pdfW, pdfH);
  }

  document.body.removeChild(host);
  return pdf.output('datauristring');
}

const STEP_ORDER = ["lead","inventory","operations","marketing","thankyou"];

/* ---------------- BACKEND CONFIG ----------------
   The NAC Express backend (same one the main assessment tool uses) — sends
   the lead notification + the branded PDF as a real Resend attachment. See
   backend/src/modules/businessHealthCheck/ in the repo. */
const BACKEND_URL = "https://nac-inventory-health-assessment-api.onrender.com/api/v1";

/* ---------------- GOOGLE SHEET LEAD LOG (optional) ----------------
   Fill this in after setting up the Apps Script Web App
   (see NAC_GoogleSheet_Tracker_Setup.md for step-by-step instructions).
   Leave as-is if you don't want sheet logging — email will still work fine. */
const SHEET_WEBHOOK_URL = "YOUR_APPS_SCRIPT_WEB_APP_URL";

/* ---------------- State ---------------- */
let state = { step:0, answers:{} };

function totalSteps(){ return STEP_ORDER.length - 1; } // excluding results

function calcCategoryScore(catKey){
  const cat = QUESTIONS[catKey];
  let sum=0, max=0;
  cat.questions.forEach(q=>{
    if(q.scored === false) return; // quantitative-only question, not part of health score
    max += 2;
    const val = state.answers[q.id];
    if(typeof val === "number") sum += val;
  });
  return Math.round((sum/max)*100);
}

function scoreLabel(pct){
  if(pct>=75) return {t:"Strong", c:"var(--teal)"};
  if(pct>=45) return {t:"Needs Attention", c:"var(--amber)"};
  return {t:"Critical Gap", c:"var(--danger)"};
}

function catRecommendation(catKey, pct){
  const recs = {
    inventory: {
      low:"Significant capital is likely stuck in dead/slow stock. An Inventory Health Check can quantify the exact loss and fix reorder points.",
      mid:"Reasonable tracking in place, but reorder logic and periodic audits could tighten cash flow further.",
      high:"Inventory discipline is strong — fine-tuning ABC/FSN analysis can still unlock incremental savings."
    },
    operations: {
      low:"Operations depend heavily on you personally — this limits growth and creates risk. SOP documentation is the priority.",
      mid:"Some structure exists; formalizing SOPs and delegating consistently will reduce errors and free up your time.",
      high:"Operations run well independently — a light process audit can catch remaining inefficiencies."
    },
    marketing: {
      low:"You're likely invisible to new local customers searching online. Google Business Profile setup should be step one.",
      mid:"A presence exists but isn't converting — consistent posting and review generation will drive more footfall.",
      high:"Strong digital presence — the opportunity now is paid local ads and review-driven growth."
    }
  };
  const bucket = pct>=75?"high":pct>=45?"mid":"low";
  return recs[catKey][bucket];
}

/* ---------------- Render ---------------- */
function render(){
  const app = document.getElementById('app');
  const key = STEP_ORDER[state.step];

  if(key === "thankyou"){ app.innerHTML = renderThankYou(); return; }

  if(key === "lead"){ app.innerHTML = renderLeadStep(); attachLeadEvents(); return; }

  app.innerHTML = renderQuestionStep(key);
  attachQuestionEvents(key);
}

function header(){
  return `
    <div class="brand">
      <img class="brand-logo-img" src="${LOGO_MEDIUM}">
    </div>
    <div class="brand-tagline">TRANSFORMING OPERATIONS &middot; DELIVERING RESULTS</div>`;
}

function progress(){
  const idx = state.step; // 0-3 are form steps
  const pct = Math.round((idx/totalSteps())*100);
  return `
    <div class="progress-wrap">
      <div class="progress-track"><div class="progress-fill" style="width:${pct}%"></div></div>
      <div class="progress-label"><span>Step ${idx+1} of ${totalSteps()}</span><span>${pct}% complete</span></div>
    </div>`;
}

function renderLeadStep(){
  const cfg = QUESTIONS.lead;
  const fieldsHtml = cfg.fields.map(f=>`
    <div class="field">
      <label>${f.label}</label>
      <input type="${f.type}" id="${f.id}" placeholder="${f.placeholder}" value="${state.answers[f.id]||''}">
    </div>`).join('');

  return `
    ${header()}
    <div class="hero">
      <h1>Free Business Health Check</h1>
      <p>Answer a few quick questions across Inventory, Operations & Digital Marketing — get an instant scored report showing exactly where your business stands and what to fix first.</p>
      <div class="hero-pillars">
        <div class="pillar"><span class="dot inv"></span><div><span class="p-title">Inventory</span><span class="p-sub">Dead stock, reorder logic</span></div></div>
        <div class="pillar"><span class="dot ops"></span><div><span class="p-title">Operations</span><span class="p-sub">SOPs, efficiency</span></div></div>
        <div class="pillar"><span class="dot dm"></span><div><span class="p-title">Digital Marketing</span><span class="p-sub">Visibility, new customers</span></div></div>
      </div>
    </div>
    <div class="card">
      <div class="step-eyebrow">${cfg.eyebrow}</div>
      <div class="step-title">${cfg.title}</div>
      ${fieldsHtml}
      <div class="nav-row">
        <button class="btn-primary" id="nextBtn">Start Health Check →</button>
      </div>
    </div>
    <div class="footer-note">Takes about 3 minutes · 100% free · No obligation</div>
  `;
}

function renderQuestionStep(key){
  const cfg = QUESTIONS[key];
  const isLastStep = STEP_ORDER[state.step+1] === "thankyou";
  const qHtml = cfg.questions.map(q=>{
    const opts = q.options.map(o=>{
      const selected = state.answers[q.id]===o.v ? 'selected':'';
      return `<div class="choice ${selected}" data-qid="${q.id}" data-val="${o.v}">
        <span class="radio"></span><span>${o.t}</span>
      </div>`;
    }).join('');
    return `
      <div class="field">
        <label>${q.q}</label>
        <div class="choice-grid">${opts}</div>
      </div>`;
  }).join('');

  return `
    ${header()}
    ${progress()}
    <div class="card">
      <div class="step-eyebrow">${cfg.eyebrow}</div>
      <div class="step-title">${cfg.title}</div>
      ${qHtml}
      <div class="nav-row">
        <button class="btn-ghost" id="backBtn">← Back</button>
        <button class="btn-primary" id="nextBtn" disabled>${isLastStep ? 'Submit ✓' : 'Continue →'}</button>
      </div>
    </div>
  `;
}

function attachLeadEvents(){
  document.getElementById('nextBtn').addEventListener('click', ()=>{
    const cfg = QUESTIONS.lead;
    let valid = true;
    cfg.fields.forEach(f=>{
      const val = document.getElementById(f.id).value.trim();
      state.answers[f.id] = val;
      if(!val && (f.id==='bizName'||f.id==='ownerName'||f.id==='phone')) valid=false;
    });
    if(!valid){ alert('Please fill Business Name, Owner Name and Phone to continue.'); return; }
    state.step++; render();
  });
}

function attachQuestionEvents(key){
  const cfg = QUESTIONS[key];
  const backBtn = document.getElementById('backBtn');
  const nextBtn = document.getElementById('nextBtn');

  function checkComplete(){
    const done = cfg.questions.every(q=>typeof state.answers[q.id]==='number');
    nextBtn.disabled = !done;
  }

  document.querySelectorAll('.choice').forEach(el=>{
    el.addEventListener('click', ()=>{
      const qid = el.dataset.qid;
      const val = parseInt(el.dataset.val);
      state.answers[qid] = val;
      document.querySelectorAll(`.choice[data-qid="${qid}"]`).forEach(c=>c.classList.remove('selected'));
      el.classList.add('selected');
      checkComplete();
    });
  });

  const isLastStep = STEP_ORDER[state.step+1] === "thankyou";
  backBtn.addEventListener('click', ()=>{ state.step--; render(); });
  nextBtn.addEventListener('click', ()=>{
    if(isLastStep){ handleSubmit(nextBtn); }
    else { state.step++; render(); }
  });
  checkComplete();
}

function renderThankYou(){
  return `
    ${header()}
    <div class="card" style="text-align:center; padding:36px 24px;">
      <div style="font-size:44px; margin-bottom:12px;">✅</div>
      <div class="step-title" style="margin-bottom:10px;">Thank you, ${state.answers.ownerName || ''}!</div>
      <p style="color:var(--muted); font-size:14px; max-width:44ch; margin:0 auto 6px;">
        We've received your Business Health Check for <b>${state.answers.bizName || 'your business'}</b>.
      </p>
      <p style="color:var(--muted); font-size:14px; max-width:44ch; margin:0 auto;">
        Our team is reviewing your answers across Inventory, Operations & Digital Marketing.
        You'll hear from us on WhatsApp with your personalised report within the
        <b>next 48 hours</b>.
      </p>
    </div>
    <div class="promo-footer">
      <img src="${LOGO_MEDIUM}">
      <div class="pf-tag">Transforming Operations. Delivering Results.</div>
      <div class="pf-contact">${REPORT_CONTACT.phone} &middot; ${REPORT_CONTACT.email} &middot; ${REPORT_CONTACT.website}</div>
    </div>
  `;
}

function handleSubmit(btn){
  // record the last question's answer (already captured via choice click listeners)
  btn.disabled = true;
  btn.textContent = 'Submitting...';

  const invScore = calcCategoryScore('inventory');
  const opsScore = calcCategoryScore('operations');
  const dmScore = calcCategoryScore('marketing');
  const overall = Math.round((invScore+opsScore+dmScore)/3);

  // Build the full 5-page branded PDF off-screen — client never sees it
  generateBrandedPDF(invScore, opsScore, dmScore, overall)
    .then(pdfBase64 => sendLeadEmail(invScore, opsScore, dmScore, overall, pdfBase64))
    .catch(err => {
      console.error('PDF generation failed', err);
      sendLeadEmail(invScore, opsScore, dmScore, overall, null);
    });

  // Fire-and-forget: log the lead to Google Sheets in parallel (doesn't block the flow above)
  logToSheet(invScore, opsScore, dmScore, overall);
}

function logToSheet(invScore, opsScore, dmScore, overall){
  if (SHEET_WEBHOOK_URL === "YOUR_APPS_SCRIPT_WEB_APP_URL") return; // not configured yet
  const payload = {
    timestamp: new Date().toLocaleString('en-IN'),
    bizName: state.answers.bizName || '',
    ownerName: state.answers.ownerName || '',
    phone: state.answers.phone || '',
    email: state.answers.email || '',
    area: state.answers.area || '',
    overallScore: overall,
    inventoryScore: invScore,
    operationsScore: opsScore,
    marketingScore: dmScore
  };
  fetch(SHEET_WEBHOOK_URL, {
    method: 'POST',
    mode: 'no-cors', // Apps Script doesn't return readable CORS response; fire-and-forget is fine here
    headers: { 'Content-Type': 'text/plain;charset=utf-8' },
    body: JSON.stringify(payload)
  }).catch(err => console.error('Sheet logging failed (non-critical):', err));
}

/* Converts jsPDF's datauristring output ("data:application/pdf;filename=...;base64,XXXX")
   into a clean "data:application/pdf;base64,XXXX" data URL — the format the backend's
   businessHealthCheck.validation.ts schema expects for pdfBase64. Returns '' if PDF
   generation failed upstream, so the submission still goes through (backend rejects
   an empty/invalid pdfBase64 with a clean 400, logged but not fatal to the user). */
function toCleanPdfDataUrl(datauristring){
  if (!datauristring) return '';
  const base64Payload = datauristring.split('base64,')[1];
  return base64Payload ? `data:application/pdf;base64,${base64Payload}` : '';
}

/* Sends the lead + the real generated PDF to the NAC backend, which emails NAC's
   internal inbox via Resend with the PDF as a genuine attachment (see
   backend/src/modules/businessHealthCheck/). Replaces the previous EmailJS-based
   send entirely — EmailJS couldn't carry the PDF (its 50KB variables-size limit
   rejected it with a 413 well before this point). */
function sendLeadEmail(invScore, opsScore, dmScore, overall, pdfBase64){
  const REPORT_PAYLOAD = {
    bizName: state.answers.bizName || '',
    ownerName: state.answers.ownerName || '',
    phone: state.answers.phone || '',
    email: state.answers.email || '',
    area: state.answers.area || '',
    overallScore: overall,
    inventoryScore: invScore,
    operationsScore: opsScore,
    marketingScore: dmScore,
    pdfBase64: toCleanPdfDataUrl(pdfBase64)
  };

  function finish(){ state.step++; render(); }

  fetch(`${BACKEND_URL}/business-health-check`, {
    method: 'POST',
    headers: { 'Content-Type': 'application/json' },
    body: JSON.stringify(REPORT_PAYLOAD)
  })
    .then(res => {
      if (!res.ok) throw new Error('Report email request failed with status ' + res.status);
    })
    .then(finish)
    .catch(err => { console.error('Business Health Check report submission failed', err); finish(); });
}

render();
</script>
